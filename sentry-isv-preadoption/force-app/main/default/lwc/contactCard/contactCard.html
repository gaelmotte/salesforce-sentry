<template>
  <lightning-card icon-name="standard:contact">
    <template lwc:if={contact}>
      <div class="slds-m-around_medium">
        <p class="slds-text-heading_small">{fullName}</p>
        <p class="slds-text-body_regular slds-m-top_x-small">{contact.Email}</p>
        <p class="slds-text-body_regular slds-m-top_x-small">{contact.Phone}</p>
      </div>
      <div slot="footer">
        <lightning-button
          label="View Details"
          variant="base"
          onclick={handleClick}
        ></lightning-button>
      </div>
    </template>
  </lightning-card>
</template>
